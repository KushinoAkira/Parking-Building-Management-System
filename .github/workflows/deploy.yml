name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  verify:
    name: verify-before-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Verify frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify backend
        working-directory: ./backend
        run: |
          dotnet restore ParkingBuildingManagement.slnx
          dotnet build ParkingBuildingManagement.slnx --configuration Release --no-restore
          dotnet test ParkingBuildingManagement.slnx --configuration Release --no-build --verbosity normal

  deploy-api:
    name: deploy-railway-api
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    container: ghcr.io/railwayapp/cli:latest

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Deploy API to Railway
        working-directory: backend/ParkingBuildingManagement.Api
        run: |
          railway up \
            --service "${{ vars.RAILWAY_SERVICE_NAME }}" \
            --environment "${{ vars.RAILWAY_ENVIRONMENT }}" \
            --ci

  deploy-frontend:
    name: deploy-firebase-hosting
    needs: verify
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Build frontend for production
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firebase Hosting
        working-directory: ./frontend
        run: npx firebase-tools@13.35.1 deploy --only hosting --project parking-management-syste-97d18 --non-interactive

  smoke:
    name: post-deploy-smoke
    needs: [deploy-api, deploy-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: API health check
        run: |
          API_URL="${{ vars.VITE_API_BASE_URL }}"
          API_URL="${API_URL%/}"
          echo "Checking ${API_URL}/api/health"
          for attempt in $(seq 1 18); do
            if curl -fsS "${API_URL}/api/health" | tee health.json; then
              grep -qi '"status"' health.json && exit 0
            fi
            echo "Attempt ${attempt}/18 failed, retrying in 10s..."
            sleep 10
          done
          echo "API health check failed"
          exit 1

      - name: Firebase hosting check
        run: |
          SITE_URL="${{ vars.FIREBASE_HOSTING_URL }}"
          SITE_URL="${SITE_URL%/}"
          echo "Checking ${SITE_URL}"
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" "${SITE_URL}"
